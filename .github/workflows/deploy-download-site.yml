name: Deploy Download Site

# 将 download/index.html 静态下载站部署到 GitHub Pages 项目站点
# https://insight68.github.io/ScienceX/

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'download/**'
      - '.github/workflows/deploy-download-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署需要严格的 environment 配置：同一 ref 只允许一个进行中的部署
concurrency:
  group: deploy-download-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: download
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
